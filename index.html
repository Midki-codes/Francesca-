<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Francesca Ritchey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap">
<style>
:root{--g:#240115;--t:#f3efe0;--m:#ada3b0;--l:#4a2a38;--a:#ef798a;--s:#2f131e;--p1:#2f131e;--p2:#3b1a28;--p3:#472133}
*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--t);font:14px 'DM Sans',Helvetica,Arial,sans-serif;display:flex;min-height:100vh}
a{color:inherit;text-decoration:none}a:hover{color:var(--a)}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
p{margin:0}h1{margin:0;font:300 44px/1.1 'DM Sans',sans-serif;letter-spacing:.04em}h2{margin:0;font:300 24px/1.2 'DM Sans',sans-serif}
.m{font:400 12px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}
.lk{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:none;border:0}
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--t);padding:0 24px;min-height:56px;font-size:14px;background:none}
.btn:hover{background:var(--a);border-color:var(--a);color:var(--g)}
.menu{width:220px;flex:none;padding:36px 28px;border-right:1px solid var(--l);position:sticky;top:0;height:100vh;overflow:auto;font-size:13px}
.menu .nm{display:block;font-weight:300;font-size:19px;line-height:1.15;letter-spacing:.04em;margin-bottom:28px}.menu .nm img{display:block;margin-bottom:12px}
.menu .lk{display:flex;min-height:32px;width:100%}.menu .s{color:var(--m);padding-left:12px}
.menu .cur{border-left:1px solid var(--a);color:var(--t);padding-left:11px;margin-left:0}
.menu summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;min-height:32px;font:400 12px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--m);border-top:1px solid var(--l)}
.menu summary::-webkit-details-marker{display:none}.menu details[open] summary svg{transform:rotate(180deg)}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 0 8px}.tl{display:flex;align-items:center}.tr{display:flex;align-items:center}
.l{display:inline-flex;align-items:center;padding:0 8px;min-height:44px;font-size:13px;background:none;border:0;color:var(--m)}.l[aria-current=true]{color:var(--t);font-weight:500}
.mob{display:none}
.pad{padding:20px 36px 36px;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:120px;grid-auto-flow:dense;gap:14px}
.t{position:relative;display:block;background:var(--p1);overflow:hidden}.t:nth-child(3n+2){background:var(--p2)}.t:nth-child(3n){background:var(--p3)}
.t img{width:100%;height:100%;object-fit:cover;display:block}.t.big{grid-column:span 2;grid-row:span 2}.t.tall{grid-row:span 2}.t.wide{grid-column:span 2}
.t span{position:absolute;left:0;bottom:0;background:var(--g);padding:6px 12px;font:400 12px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.t:hover{outline:2px solid var(--a);outline-offset:2px}.t:hover span{background:var(--a);color:var(--g)}
.sib{display:flex;gap:28px;margin-top:20px;border-top:1px solid var(--l);overflow-x:auto;white-space:nowrap}.sib>*{flex:none;color:var(--m)}.sib .on{color:var(--t);border-bottom:2px solid var(--a)}
.band{margin-top:36px;background:var(--s);padding:32px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.doors{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:36px}.doors .band{margin:0}.store{padding:32px 8px;display:flex;flex-direction:column;justify-content:center}
.split{display:flex;gap:48px;align-items:flex-start}.por{width:360px;height:480px;flex:none;background:var(--p2);position:sticky;top:24px}.por img{width:100%;height:100%;object-fit:cover;display:block}
.bio{font-size:15px;line-height:1.7;margin-bottom:16px}
.r{display:grid;grid-template-columns:90px 1fr 280px 110px;gap:24px;border-top:1px solid var(--l);padding:18px 0;align-items:baseline}
.row{display:grid;grid-template-columns:180px 1fr;gap:24px;border-top:1px solid var(--l);padding:16px 0}
.big-mail{font-size:40px;font-weight:300;border-bottom:1px solid var(--t);min-height:64px;overflow-wrap:anywhere}
.cp{border:1px solid var(--l);background:none;padding:0 16px;min-height:44px;font-size:13px}
footer{padding:0 36px 28px;font-size:12px;color:var(--m)}
#lb[hidden]{display:none}
#lb{position:fixed;inset:0;background:var(--g);z-index:50;display:flex;flex-direction:column}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:70px 100px 10px;min-height:0}
#lb figure{margin:0;position:relative;max-width:100%;max-height:100%;display:flex}#lb img{max-width:100%;max-height:100%;display:block;object-fit:contain}
#lb .ph{width:min(1000px,70vw);height:60vh;background:var(--p2)}#lb figcaption{position:absolute;left:0;bottom:0;background:var(--g);padding:6px 12px;font:400 12px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
#lb .nb{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border:1px solid var(--l);background:none;display:flex;align-items:center;justify-content:center}
#lb .nb:hover,#lb .cl:hover{background:var(--a);color:var(--g);border-color:var(--a)}#lb .nx{right:40px;width:52px;height:52px;border-color:var(--t)}#lb .pv{left:44px}
#lb .cl{position:absolute;top:16px;right:16px;width:44px;height:44px;border:1px solid var(--l);background:none;display:flex;align-items:center;justify-content:center}
#lb .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 100px 20px}#lb .bar a{justify-self:end}
@media(max-width:860px){
 body{flex-direction:column}.mob{display:inline-flex}
 .menu{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;width:auto;height:auto;z-index:20;background:var(--g);border:0;padding:8px 20px;font-size:15px}
 .menu .nm{display:none}.menu .lk,.menu summary{min-height:44px}body.menu-open .menu{display:block}
 .top{position:sticky;top:0;z-index:30;background:var(--g);height:56px;padding:6px 8px;border-bottom:1px solid var(--l)}
 .pad{padding:16px}.grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:104px;gap:12px}
 h1{font-size:32px}.split,.band{flex-direction:column;align-items:stretch;gap:24px}.por{position:static;width:100%;height:400px}
 .r,.row,.doors{grid-template-columns:1fr;gap:6px}.big-mail{font-size:24px}footer{padding:0 16px 28px}
 #lb .stage{padding:64px 12px 10px}#lb .nb{top:auto;bottom:70px;margin:0}#lb .pv{left:16px}#lb .nx{right:16px}#lb .bar{padding:8px 16px 20px;grid-template-columns:1fr;gap:4px;justify-items:center}#lb .bar a{justify-self:center}
}
</style></head><body><div id="app" style="display:contents"></div><div id="lb" hidden></div>
<script src="content.js"></script>
<script>
const UI={es:{home:'Inicio',com:'Comercial',pro:'Proyectos',about:'Sobre mí',contact:'Contacto',shop:'Tienda',exh:'Exposiciones y premios',write:'Escríbeme',more:'Más en',close:'Cerrar',prev:'Imagen anterior',next:'Imagen siguiente',all:'Ver todas',store:'Ver en la tienda',prints:'Impresiones disponibles en PurePhoto.',proj:'¿Tienes un proyecto en mente?',talk:'Escríbeme y lo platicamos: ',copy:'Copiar',copied:'Copiado',also:'También en',menu:'Menú',en:'Ampliar imagen',year:'Año',name:'Nombre',venue:'Sede y ciudad',type:'Tipo',intro:'Cuéntame qué tienes en mente.',a1:'Para proyectos',a1t:'Si buscas una fotógrafa para tu marca, tu publicación o tu evento, cuéntame qué necesitas.',a2:'Para colaborar',a2t:'Si quieres proponerme una colaboración, escríbeme y lo platicamos.',a3:'Para impresiones',a3t:'Si te interesa una impresión, escríbeme o visita ',a3l:'la tienda',nf:'No encontramos esta página.',nft:'Es posible que el enlace haya cambiado o que la página ya no exista.',go:'Ir al inicio',rights:'Todos los derechos reservados.',cat:'Categorías comerciales',prj:'Proyectos',ex:'Imagen de ejemplo'},
en:{home:'Home',com:'Commercial',pro:'Projects',about:'About',contact:'Contact',shop:'Shop',exh:'Exhibitions and awards',write:'Write to me',more:'More in',close:'Close',prev:'Previous image',next:'Next image',all:'See all',store:'View in the shop',prints:'Prints available at PurePhoto.',proj:'Have a project in mind?',talk:"Write to me and let's talk: ",copy:'Copy',copied:'Copied',also:'Also on',menu:'Menu',en:'Enlarge image',year:'Year',name:'Name',venue:'Venue and city',type:'Type',intro:'Tell me what you have in mind.',a1:'For projects',a1t:'If you are looking for a photographer for your brand, publication or event, tell me what you need.',a2:'To collaborate',a2t:'If you would like to propose a collaboration, write to me and let\u2019s talk.',a3:'For prints',a3t:'If you are interested in a print, write to me or visit ',a3l:'the shop',nf:"We couldn't find this page.",nft:'The link may have changed or the page may no longer exist.',go:'Go to home',rights:'All rights reserved.',cat:'Commercial categories',prj:'Projects',ex:'Sample image'}};
const I=(d,s=20,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" aria-hidden="true">${d}</svg>`;
const IC={ig:I('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/>',20,1.6),mail:I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',20,1.6),wa:I('<path d="M3 21l1.65-4.9A9 9 0 1 1 8 19.4L3 21z"/><path d="M9 8.6c0 3.4 3 6.4 6.4 6.4l1.1-1.5-2-1.1-.9.7c-1-.4-1.9-1.3-2.3-2.3l.7-.9-1.1-2-1.4 1.1z"/>',20,1.6),arr:I('<path d="M5 12h14m-6-6 6 6-6 6"/>'),ext:I('<path d="M7 17 17 7M8 7h9v9"/>',16),ch:I('<path d="m6 9 6 6 6-6"/>',14,2),brg:I('<path d="M4 7h16M4 12h16M4 17h16"/>'),x:I('<path d="M5 5l14 14M19 5L5 19"/>'),pv:I('<path d="m15 5-7 7 7 7"/>'),nx:I('<path d="m9 5 7 7-7 7"/>')};
let lang='es',cur=[],lb=null;const t=k=>UI[lang][k],nm=o=>o[lang]||o.es,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=SITE.photos,has=id=>P.some(p=>p.group===id),CATS=()=>SITE.categories.filter(c=>has(c.id)),PRJ=()=>SITE.projects.filter(p=>has(p.id));
const grp=id=>SITE.categories.find(c=>c.id===id)||SITE.projects.find(p=>p.id===id),gname=id=>{const g=grp(id);return g?nm(g):id},ghref=id=>SITE.categories.some(c=>c.id===id)?'#/c/'+id:'#/p/'+id;
const ig='https://instagram.com/'+SITE.instagram,wa='https://wa.me/'+SITE.whatsapp,ext=(h,l,x='')=>`<a class="lk" href="${h}" target="_blank" rel="noopener" aria-label="${esc(l)}, ${lang=='es'?'se abre en una pestaña nueva':'opens in a new tab'}" ${x}>`;
function tiles(list,chip){cur=list;return '<div class="grid">'+list.map((p,k)=>{const n=gname(p.group);return `<a class="t ${p.size||''}" href="#" data-k="${k}" draggable="false" aria-label="${esc(n)}: ${t('en')}">${p.src?`<img src="${esc(p.src)}" alt="${esc(p.alt||n)}" draggable="false" loading="lazy">`:''}${chip?`<span>${esc(n)}</span>`:''}</a>`}).join('')+'</div>'}
function band(){return `<div class="band"><div><h2 style="margin-bottom:6px;font-size:24px">${t('proj')}</h2><p style="color:var(--m)">${t('talk')}<span style="color:var(--t)">${SITE.email}</span></p></div><a class="btn" href="mailto:${SITE.email}">${t('write')} ${IC.arr}</a></div>`}
function storeLine(){return `<div class="store"><p style="color:var(--m)">${t('prints')}</p>${ext(SITE.store,t('store'),'style="font-size:13px"')}${t('store')} ${IC.ext}</a></div>`}
function sib(items,id,label){return `<nav class="sib" aria-label="${label}">`+items.map(i=>i.id===id?`<span class="lk on" aria-current="page">${nm(i)}</span>`:`<a class="lk" href="${ghref(i.id)}">${nm(i)}</a>`).join('')+'</nav>'}
function exList(n){const E=SITE.exhibitions.slice(0,n||99);return E.map(e=>`<div class="r"><p class="m" style="color:var(--t)">${esc(e.year)}</p><p style="font-size:16px;line-height:1.4">${esc(e.name)}</p><p style="font-size:14px;color:var(--m)">${esc(e.venue)}</p><p class="m">${esc(e.type)}</p></div>`).join('')}
function shell(route,body,title){const C=CATS(),Pj=PRJ(),on=(r)=>route===r?' cur':'',inC=route.startsWith('c/'),inP=route.startsWith('p/');
const sub=(arr,pre)=>arr.map(i=>`<a class="lk s${route===pre+i.id?' cur':''}" href="#/${pre}${i.id}">${esc(nm(i))}</a>`).join('');
document.title=(title?title+' · ':'')+SITE.name;
return `<nav class="menu" id="menu"><a class="nm" href="#/"><img src="images/logo-monogram.png" alt="" height="72"><span>Francesca<br>Ritchey</span></a><a class="lk${on('')}" href="#/">${t('home')}</a>
${C.length?`<details ${inC?'open':''}><summary>${t('com')} ${IC.ch}</summary>${sub(C,'c/')}</details>`:''}${Pj.length?`<details ${inP?'open':''}><summary>${t('pro')} ${IC.ch}</summary>${sub(Pj,'p/')}</details>`:''}
<div style="border-top:1px solid var(--l);margin-top:6px"></div><a class="lk${on('sobre-mi')}" href="#/sobre-mi">${t('about')}</a>${SITE.exhibitions.length?`<a class="lk s${on('exposiciones')}" href="#/exposiciones">${t('exh')}</a>`:''}<a class="lk${on('contacto')}" href="#/contacto">${t('contact')}</a>${ext(SITE.store,t('shop'))}${t('shop')} ↗</a></nav>
<div class="col"><header class="top"><div class="tl"><button class="ic mob" id="mbtn" aria-label="${t('menu')}">${IC.brg}</button><a class="ic mob" href="#/" aria-label="${SITE.name}"><img src="images/logo-monogram.png" alt="" height="32"></a></div>
<div class="tr">${ext(ig,'Instagram','class="ic" title="Instagram"')}${IC.ig}</a>${ext('mailto:'+SITE.email,'Email','class="ic" title="Email"')}${IC.mail}</a>${ext(wa,'WhatsApp','class="ic" title="WhatsApp"')}${IC.wa}</a>
<span style="width:8px"></span><button class="l" data-lang="es" lang="es" aria-current="${lang=='es'}">ES</button>/<button class="l" data-lang="en" lang="en" aria-current="${lang=='en'}">EN</button></div></header>
<main class="pad">${body}</main><footer>© ${new Date().getFullYear()} ${SITE.name}. ${t('rights')}</footer></div>`}
function render(){const h=location.hash.replace(/^#\/?/,''),[a,id]=h.split('/');let body='',title='',route=h;
if(h===''){const hl=P.filter(p=>p.home);body=tiles(hl.length?hl:P.slice(0,12),true);route=''}
else if(a==='c'&&CATS().some(c=>c.id===id)){const g=grp(id);title=nm(g);body=`<p class="m" style="margin-bottom:8px">${t('com')}</p><h1>${esc(nm(g))}</h1>${sib(CATS(),id,t('cat'))}<div style="margin-top:28px">${tiles(P.filter(p=>p.group===id))}</div>${band()}`}
else if(a==='p'&&PRJ().some(p=>p.id===id)){const g=grp(id);title=nm(g);body=`<p class="m" style="margin-bottom:8px">${t('pro')}</p><h1>${esc(nm(g))}</h1><p style="margin-top:16px;max-width:560px;font-size:15px;line-height:1.6;color:var(--m)">${esc(nm(g.desc))}</p>${sib(PRJ(),id,t('prj'))}<div style="margin-top:28px">${tiles(P.filter(p=>p.group===id))}</div>${g.store?`<div class="doors">${band()}<div class="store"><p style="color:var(--m);font-size:14px">${t('prints')}</p>${ext(g.store,t('store'),'style="font-size:13px"')}${t('store')} ${IC.ext}</a></div></div>`:band()}`}
else if(h==='sobre-mi'){title=t('about');const A=SITE.about,bio=(A[lang]&&A[lang].length?A[lang]:A.es);body=`<div class="split"><div class="por" role="img" aria-label="${SITE.name}">${A.portrait?`<img src="${esc(A.portrait)}" alt="${SITE.name}">`:''}</div><div style="max-width:560px"><p class="m" style="margin-bottom:8px">${t('about')}</p><h1 style="margin-bottom:24px">${SITE.name}</h1>${bio.map(x=>`<p class="bio">${esc(x)}</p>`).join('')}${SITE.exhibitions.length?`<section aria-label="${t('exh')}" style="margin:24px 0 40px"><p class="m" style="margin-bottom:12px">${t('exh')}</p>${SITE.exhibitions.slice(0,3).map(e=>`<div style="border-top:1px solid var(--l);padding:14px 0"><p style="font-size:15px">${esc(e.name)}</p><p class="m" style="margin-top:4px;text-transform:none">${esc([e.type,e.venue,e.year].filter(Boolean).join(' · '))}</p></div>`).join('')}<a class="lk" href="#/exposiciones" style="border-top:1px solid var(--l);width:100%;font-size:13px">${t('all')} ${IC.arr}</a></section>`:''}<a class="btn" href="#/contacto">${t('write')} ${IC.arr}</a></div></div>`}
else if(h==='exposiciones'&&SITE.exhibitions.length){title=t('exh');body=`<p class="m" style="margin-bottom:8px"><a href="#/sobre-mi" style="text-decoration:underline">${t('about')}</a> / ${t('exh')}</p><h1 style="margin-bottom:40px">${t('exh')}</h1><section aria-label="${t('exh')}">${exList()}<div style="border-top:1px solid var(--l);padding-top:40px"><a class="btn" href="#/contacto">${t('write')} ${IC.arr}</a></div></section>`}
else if(h==='contacto'){title=t('contact');body=`<div style="max-width:700px"><p class="m" style="margin-bottom:8px">${t('contact')}</p><h1 style="margin-bottom:16px">${t('write')}</h1><p style="margin-bottom:40px;font-size:15px">${t('intro')}</p>
<div class="row"><p class="m">${t('a1')}</p><p style="font-size:15px;line-height:1.6">${t('a1t')}</p></div><div class="row"><p class="m">${t('a2')}</p><p style="font-size:15px;line-height:1.6">${t('a2t')}</p></div><div class="row"><p class="m">${t('a3')}</p><p style="font-size:15px;line-height:1.6">${t('a3t')}${ext(SITE.store,t('a3l'),'style="display:inline;min-height:0;text-decoration:underline"')}${t('a3l')}</a>.</p></div>
<div style="border-top:1px solid var(--l);padding-top:32px"><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><a class="lk big-mail" href="mailto:${SITE.email}">${SITE.email}</a><button class="cp" data-copy>${t('copy')}</button></div>
<div style="margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;font-size:14px;color:var(--m)"><span class="m">${t('also')}</span>${ext(wa,'WhatsApp')}WhatsApp ${IC.ext}</a>${ext(ig,'Instagram')}Instagram @${SITE.instagram} ${IC.ext}</a>${SITE.linkedin?`${ext(SITE.linkedin,'LinkedIn')}LinkedIn ${IC.ext}</a>`:''}</div></div></div>`}
else{title='404';route='404';body=`<div style="max-width:560px;padding-top:48px"><p class="m" style="margin-bottom:8px">Error 404</p><h1 style="margin-bottom:16px">${t('nf')}</h1><p style="font-size:15px;line-height:1.6;margin-bottom:32px">${t('nft')}</p><a class="btn" href="#/">${t('go')} ${IC.arr}</a></div>`}
document.getElementById('app').innerHTML=shell(route,body,title);document.body.classList.remove('menu-open');if(!lb)scrollTo(0,0)}
function drawLB(){const p=cur[lb.i],n=gname(p.group),el=document.getElementById('lb');el.hidden=false;
el.innerHTML=`<div class="stage"><figure>${p.src?`<img src="${esc(p.src)}" alt="${esc(p.alt||n)}" draggable="false">`:`<div class="ph" role="img" aria-label="${t('ex')}"></div>`}<figcaption>${esc(n)}</figcaption></figure></div>
<button class="cl" data-a="close" aria-label="${t('close')}">${IC.x}</button><button class="nb pv" data-a="prev" aria-label="${t('prev')}">${IC.pv}</button><button class="nb nx" data-a="next" aria-label="${t('next')}">${IC.nx}</button>
<div class="bar"><span class="m">${lb.i+1} / ${cur.length}</span><span class="m" style="text-transform:none">© ${SITE.name}</span><a class="lk" href="${ghref(p.group)}" data-a="close" style="font-size:14px">${t('more')} ${esc(n)} ${IC.arr}</a></div>`;
el.querySelector('.cl').focus()}
function closeLB(){document.getElementById('lb').hidden=true;const o=lb&&lb.opener;lb=null;if(o&&document.body.contains(o))o.focus()}
document.addEventListener('click',e=>{const T=e.target.closest('.t');if(T&&T.dataset.k!==undefined){e.preventDefault();lb={i:+T.dataset.k,opener:T};drawLB();return}
const a=e.target.closest('[data-a]');if(a){if(a.dataset.a==='close'){closeLB();return}const n=cur.length;lb.i=(lb.i+(a.dataset.a==='next'?1:-1)+n)%n;drawLB();return}
const L=e.target.closest('[data-lang]');if(L){lang=L.dataset.lang;document.documentElement.lang=lang;render();return}
if(e.target.closest('#mbtn')){document.body.classList.toggle('menu-open');return}
const C=e.target.closest('[data-copy]');if(C){(navigator.clipboard?navigator.clipboard.writeText(SITE.email):Promise.reject()).catch(()=>{}).finally(()=>{C.textContent=t('copied');setTimeout(()=>C.textContent=t('copy'),2000)})}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.t,#lb,.por'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(!lb)return;const n=cur.length;if(e.key==='Escape')closeLB();else if(e.key==='ArrowRight'){lb.i=(lb.i+1)%n;drawLB()}else if(e.key==='ArrowLeft'){lb.i=(lb.i-1+n)%n;drawLB()}
else if(e.key==='Tab'){const f=[...document.querySelectorAll('#lb button,#lb a')],i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}});
addEventListener('hashchange',()=>{if(lb)closeLB();render()});render();
</script></body></html>
